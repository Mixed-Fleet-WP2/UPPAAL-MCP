[project]
name = "uppaal-mcp"
version = "0.1.0"
description = "MCP server for agentic model checking with UPPAAL verifyta"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2",
    "lxml>=5.0",
]

[project.scripts]
uppaal-mcp = "server.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: runs the real verifyta binary (skipped if unavailable)"]
